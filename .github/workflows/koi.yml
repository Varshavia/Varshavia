name: Koi

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi

      - name: Commit the koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif koi/koi.png
          git diff --cached --quiet || git commit -m "Update koi"
          git push
